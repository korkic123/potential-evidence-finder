name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release assets
        shell: pwsh
        run: .\build\build_windows.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: potential-evidence-finder-windows
          path: release/*
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "Potential Evidence Finder $tag" --notes-file "RELEASE_NOTES_v1.0.0.md"
          }
          Get-ChildItem release -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
